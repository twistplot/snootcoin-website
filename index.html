<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SNOOT – The Anti-Boop Token</title>
  <style>
    :root {
      --primary: #ff4d4d;
      --primary-dark: #ff1a1a;
      --bg: #0f0f0f;
    }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    #snoot {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 30px;
      box-shadow: 0 0 20px var(--primary);
      margin: 20px 0;
      transition: all 0.3s;
      border: 3px solid var(--primary);
      cursor: pointer;
    }
    h1 {
      font-size: 3em;
      color: var(--primary);
      text-shadow: 2px 2px 4px #000;
    }
    .button {
      display: inline-block;
      padding: 12px 25px;
      background: var(--primary);
      color: white;
      font-size: 1.1em;
      text-decoration: none;
      border-radius: 20px;
      margin: 20px 0;
      transition: all 0.3s;
    }
    .button:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
    }
    .score {
      font-size: 1.5em;
      margin: 15px 0;
    }
    .high-score {
      color: var(--primary);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- YOUR SINGLE IMAGE WITH PROTECTION -->
    <img id="snoot" 
         src="https://i.postimg.cc/vBfCx4Tt/A-2-D-digital-illustration-features-a-cartoon-Shiba.png" 
         alt="SNOOT the Shiba Inu"
         onerror="this.src='https://i.imgur.com/3QZQZQZ.png'">

    <h1>$SNOOT</h1>
    <p>Boop the snoot to earn points!</p>
    
    <div class="score">
      Score: <span id="score">0</span> | 
      High: <span id="high-score" class="high-score">0</span>
    </div>

    <a href="https://pump.fun" class="button" target="_blank">Buy on Pump.fun</a>
  </div>

  <script>
    // Game Elements
    const snoot = document.getElementById('snoot');
    const scoreDisplay = document.getElementById('score');
    const highScoreDisplay = document.getElementById('high-score');

    // Game Variables
    let score = 0;
    let highScore = localStorage.getItem('snootHighScore') || 0;
    highScoreDisplay.textContent = highScore;

    // Click Handler
    snoot.addEventListener('click', () => {
      // Animation
      snoot.style.transform = 'scale(0.9)';
      setTimeout(() => snoot.style.transform = 'scale(1)', 200);
      
      // Score logic
      score += 10;
      scoreDisplay.textContent = score;
      
      // Update high score
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = highScore;
        localStorage.setItem('snootHighScore', highScore);
      }
    });
  </script>
</body>
</html>
